<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- 1. Sunset Amber Glass Base Gradient (#EA6113 -> #F88F22 -> #FBB931 -> #FFE3B3) -->
    <linearGradient id="sunset_glass_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A170C" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#EA6113" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#F88F22" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#FBB931" stop-opacity="0.58" />
    </linearGradient>

    <!-- 2. Glowing Glass Bevel Outer Stroke (#FFE3B3 -> #FBB931 -> #F88F22 -> #EA6113) -->
    <linearGradient id="sunset_glass_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3B3" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#FBB931" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#F88F22" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#EA6113" stop-opacity="0.85" />
    </linearGradient>

    <!-- 3. Inner Specular Glare (#FFE3B3) -->
    <linearGradient id="specular_inner_stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE3B3" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FBB931" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EA6113" stop-opacity="0.1" />
    </linearGradient>

    <!-- 4. Energy Box Glass Gradient -->
    <linearGradient id="energy_box_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA6113" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#F88F22" stop-opacity="0.25" />
    </linearGradient>

    <!-- 5. Macro Box Glass Gradient -->
    <linearGradient id="macro_box_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3B3" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FBB931" stop-opacity="0.08" />
    </linearGradient>

    <!-- 6. Bottom-Right Ambient Sunset Glow -->
    <radialGradient id="bottom_sunset_glow" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#EA6113" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#F88F22" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E120B" stop-opacity="0.0" />
    </radialGradient>

    <!-- 7. Glass Soft Drop Shadow -->
    <filter id="sunset_glass_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#381F12" flood-opacity="0.4" />
    </filter>

    <!-- 8. Sharp Text Drop Shadow -->
    <filter id="text_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Clip Path for Glass Base -->
    <clipPath id="card_clip">
      <rect x="30" y="30" width="740" height="940" rx="72" />
    </clipPath>
  </defs>

  <!-- Outer Card Glass Shell -->
  <rect x="30" y="30" width="740" height="940" rx="72" fill="url(#sunset_glass_base)" stroke="url(#sunset_glass_border)" stroke-width="3" filter="url(#sunset_glass_shadow)" />

  <!-- Internal Glass Refraction & Ambient Glows -->
  <g clip-path="url(#card_clip)">
    <!-- Bottom Right Ambient Sunset Glow -->
    <rect x="30" y="30" width="740" height="940" fill="url(#bottom_sunset_glow)" />

    <!-- Top-Left Corner Specular Reflection Curve -->
    <path d="M 30 180 C 30 100 100 30 180 30 L 340 30 C 180 55 55 180 30 340 Z" fill="#FFE3B3" opacity="0.3" />

    <!-- Top Section Glass Accent Pill Header -->
    <rect x="60" y="65" width="220" height="44" rx="22" fill="#FFE3B3" fill-opacity="0.15" stroke="#FFE3B3" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Top Horizontal Divider Line -->
    <line x1="30" y1="135" x2="770" y2="135" stroke="#FFE3B3" stroke-opacity="0.22" stroke-width="1.5" />

    <!-- Bottom Horizontal Divider Line -->
    <line x1="30" y1="840" x2="770" y2="840" stroke="#FFE3B3" stroke-opacity="0.22" stroke-width="1.5" />
  </g>

  <!-- Header Content -->
  <!-- Top Left Pill Header Text -->
  <text id="tv_heading" x="170" y="93" font-family="sans-serif-black, sans-serif" font-size="14" font-weight="900" fill="#FFE3B3" text-anchor="middle" letter-spacing="1.5">🌅 SUNSET GLOW</text>

  <!-- Top Right Year/Date -->
  <text id="tv_date" x="720" y="94" font-family="sans-serif-bold, sans-serif" font-size="18" font-weight="700" fill="#FFE3B3" text-anchor="end" filter="url(#text_shadow)">2026</text>

  <!-- Food Title Section -->
  <text id="tv_food_name" x="60" y="210" font-family="sans-serif-black, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">Grilled Chicken &amp; Salad</text>

  <!-- Hero Energy Card (Calories Box) -->
  <rect x="60" y="260" width="680" height="150" rx="28" fill="url(#energy_box_glass)" stroke="url(#specular_inner_stroke)" stroke-width="2" />
  <text x="95" y="305" font-family="sans-serif-black, sans-serif" font-size="14" font-weight="900" fill="#FBB931" letter-spacing="2">TOTAL ENERGY</text>
  <text id="tv_calories" x="95" y="375" font-family="sans-serif-black, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">520 kcal</text>

  <!-- Energy Flame Icon Graphic (#EA6113) -->
  <circle cx="680" cy="335" r="32" fill="#EA6113" fill-opacity="0.3" stroke="#FBB931" stroke-width="2" />
  <text x="680" y="343" font-family="sans-serif" font-size="28" text-anchor="middle">🔥</text>

  <!-- Macro Breakdown Grid (Protein, Carbs, Fat Cards) -->
  <!-- Protein Card (#EA6113) -->
  <rect x="60" y="440" width="210" height="370" rx="24" fill="url(#macro_box_glass)" stroke="#EA6113" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="165" cy="490" r="24" fill="#EA6113" fill-opacity="0.3" />
  <text x="165" y="498" font-family="sans-serif" font-size="22" text-anchor="middle">💪</text>
  <text x="85" y="550" font-family="sans-serif-bold, sans-serif" font-size="16" font-weight="700" fill="#F88F22">PROTEIN</text>
  <text id="tv_protein" x="85" y="620" font-family="sans-serif-black, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">42g</text>

  <!-- Carbs Card (#F88F22) -->
  <rect x="295" y="440" width="210" height="370" rx="24" fill="url(#macro_box_glass)" stroke="#F88F22" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="400" cy="490" r="24" fill="#F88F22" fill-opacity="0.3" />
  <text x="400" y="498" font-family="sans-serif" font-size="22" text-anchor="middle">⚡</text>
  <text x="320" y="550" font-family="sans-serif-bold, sans-serif" font-size="16" font-weight="700" fill="#FBB931">CARBS</text>
  <text id="tv_carbs" x="320" y="620" font-family="sans-serif-black, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">55g</text>

  <!-- Fat Card (#FBB931) -->
  <rect x="530" y="440" width="210" height="370" rx="24" fill="url(#macro_box_glass)" stroke="#FBB931" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="635" cy="490" r="24" fill="#FBB931" fill-opacity="0.3" />
  <text x="635" y="498" font-family="sans-serif" font-size="22" text-anchor="middle">🥑</text>
  <text x="555" y="550" font-family="sans-serif-bold, sans-serif" font-size="16" font-weight="700" fill="#FFE3B3">FAT</text>
  <text id="tv_fat" x="555" y="620" font-family="sans-serif-black, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">12g</text>

  <!-- Footer Section -->
  <!-- User Handle Tag Pill -->
  <rect x="60" y="870" width="180" height="40" rx="20" fill="#FFE3B3" fill-opacity="0.15" stroke="#FFE3B3" stroke-opacity="0.3" stroke-width="1" />
  <text x="150" y="896" font-family="sans-serif-bold, sans-serif" font-size="18" font-weight="700" fill="#FFE3B3" text-anchor="middle">@fitbondapp</text>

  <!-- Verification Badge -->
  <rect x="540" y="870" width="200" height="40" rx="20" fill="#EA6113" fill-opacity="0.25" stroke="#FBB931" stroke-opacity="0.5" stroke-width="1" />
  <text x="640" y="896" font-family="sans-serif-bold, sans-serif" font-size="15" font-weight="800" fill="#FBB931" text-anchor="middle">🌅 SUNSET SNAP</text>
</svg>