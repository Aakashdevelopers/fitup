<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- 1. CSS Dark Glass Base Fill: rgba(0, 0, 0, 0.35) with blur(25px) simulation -->
    <linearGradient id="dark_glass_fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#09090B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.40" />
    </linearGradient>

    <!-- 2. CSS Dark Glass Border Stroke: rgba(255, 255, 255, 0.25) & rgba(0, 0, 0, 0.25) -->
    <linearGradient id="dark_glass_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FF6B00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- 3. Gym Orange Accent Gradient -->
    <linearGradient id="gym_orange_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <!-- 4. Inner Dark Glass Box Fill -->
    <linearGradient id="inner_dark_glass_box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.2" />
    </linearGradient>

    <!-- 5. Glass Drop Shadow: 0 4px 30px rgba(0, 0, 0, 0.1) -->
    <filter id="dark_glass_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- 6. Sharp Text Drop Shadow -->
    <filter id="text_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Clip Path for Card (border-radius: 16px -> rx=64 in 800x1000 ViewBox) -->
    <clipPath id="card_clip">
      <rect x="30" y="30" width="740" height="940" rx="64" />
    </clipPath>
  </defs>

  <!-- Outer Dark Glass Card Shell (background: rgba(0,0,0,0.35), border: 1px solid rgba(255,255,255,0.25)) -->
  <rect x="30" y="30" width="740" height="940" rx="64" fill="url(#dark_glass_fill)" stroke="url(#dark_glass_border)" stroke-width="2.5" filter="url(#dark_glass_shadow)" />

  <!-- Internal Refraction & Accent Highlights -->
  <g clip-path="url(#card_clip)">
    <!-- Top Glass Reflection Curve -->
    <path d="M 30 160 C 30 90 90 30 160 30 L 300 30 C 160 50 50 160 30 300 Z" fill="#FFFFFF" opacity="0.2" />

    <!-- Top Orange Pro Gym Accent Banner Pill -->
    <rect x="60" y="65" width="240" height="44" rx="22" fill="url(#gym_orange_gradient)" fill-opacity="0.25" stroke="#FF6B00" stroke-opacity="0.6" stroke-width="1.5" />

    <!-- Horizontal Divider Lines -->
    <line x1="30" y1="135" x2="770" y2="135" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="30" y1="840" x2="770" y2="840" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  </g>

  <!-- Header Section -->
  <!-- Top Left Pill Header Text -->
  <text id="tv_heading" x="180" y="93" font-family="sans-serif-black, sans-serif" font-size="14" font-weight="900" fill="#FF9E00" text-anchor="middle" letter-spacing="1.5">💪 PRO GYM FUEL</text>

  <!-- Top Right Date -->
  <text id="tv_date" x="720" y="94" font-family="sans-serif-bold, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="end" filter="url(#text_shadow)">2026</text>

  <!-- Food Title Section -->
  <text id="tv_food_name" x="60" y="210" font-family="sans-serif-black, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">Grilled Chicken &amp; Quinoa</text>

  <!-- Hero Energy Card (Calories Box) -->
  <rect x="60" y="260" width="680" height="150" rx="28" fill="url(#inner_dark_glass_box)" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="2" />
  <text x="95" y="305" font-family="sans-serif-black, sans-serif" font-size="14" font-weight="900" fill="#FF9E00" letter-spacing="2">TOTAL CALORIES</text>
  <text id="tv_calories" x="95" y="375" font-family="sans-serif-black, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">520 kcal</text>

  <!-- Flame Icon Graphic -->
  <circle cx="680" cy="335" r="32" fill="#FF6B00" fill-opacity="0.2" stroke="#FF9E00" stroke-width="2" />
  <text x="680" y="343" font-family="sans-serif" font-size="28" text-anchor="middle">🔥</text>

  <!-- Macro Breakdown Grid (Protein, Carbs, Fat Cards) -->
  <!-- Protein Card -->
  <rect x="60" y="440" width="210" height="370" rx="24" fill="url(#inner_dark_glass_box)" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="165" cy="490" r="24" fill="#3B82F6" fill-opacity="0.3" />
  <text x="165" y="498" font-family="sans-serif" font-size="22" text-anchor="middle">💪</text>
  <text x="85" y="550" font-family="sans-serif-bold, sans-serif" font-size="16" font-weight="700" fill="#93C5FD">PROTEIN</text>
  <text id="tv_protein" x="85" y="620" font-family="sans-serif-black, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">42g</text>

  <!-- Carbs Card -->
  <rect x="295" y="440" width="210" height="370" rx="24" fill="url(#inner_dark_glass_box)" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="400" cy="490" r="24" fill="#10B981" fill-opacity="0.3" />
  <text x="400" y="498" font-family="sans-serif" font-size="22" text-anchor="middle">⚡</text>
  <text x="320" y="550" font-family="sans-serif-bold, sans-serif" font-size="16" font-weight="700" fill="#A7F3D0">CARBS</text>
  <text id="tv_carbs" x="320" y="620" font-family="sans-serif-black, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">55g</text>

  <!-- Fat Card -->
  <rect x="530" y="440" width="210" height="370" rx="24" fill="url(#inner_dark_glass_box)" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="635" cy="490" r="24" fill="#EC4899" fill-opacity="0.3" />
  <text x="635" y="498" font-family="sans-serif" font-size="22" text-anchor="middle">🥑</text>
  <text x="555" y="550" font-family="sans-serif-bold, sans-serif" font-size="16" font-weight="700" fill="#FBCFE8">FAT</text>
  <text id="tv_fat" x="555" y="620" font-family="sans-serif-black, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#text_shadow)">12g</text>

  <!-- Footer Section -->
  <!-- User Handle Tag Pill -->
  <rect x="60" y="870" width="180" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
  <text x="150" y="896" font-family="sans-serif-bold, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">@fitbondapp</text>

  <!-- Verification Badge -->
  <rect x="540" y="870" width="200" height="40" rx="20" fill="#FF6B00" fill-opacity="0.2" stroke="#FF9E00" stroke-opacity="0.5" stroke-width="1" />
  <text x="640" y="896" font-family="sans-serif-bold, sans-serif" font-size="15" font-weight="800" fill="#FF9E00" text-anchor="middle">⚡ PRO GYM FUEL</text>
</svg>